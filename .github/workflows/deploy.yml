name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # production deploy — triggers on merge to main

  # Allow manual trigger from GitHub Actions tab (useful for previews)
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for peaceiris/actions-gh-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build client bundle
        run: pnpm exec tsc -b && pnpm exec vite build

      - name: Build SSR bundle
        run: pnpm exec vite build --ssr src/entry-server.tsx --outDir dist/server

      - name: Prerender all routes
        run: node scripts/prerender.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
